name: CI

on:
  push:
    branches: [production, vue3-migration, 'feat/**', 'fix/**', 'chore/**']
  pull_request:

jobs:
  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout better-together-vue
        uses: actions/checkout@v4
        with:
          path: better-together-vue

      # BTV depends on file:../community-engine-vue — check it out as a sibling
      - name: Checkout community-engine-vue
        uses: actions/checkout@v4
        with:
          repository: better-together-org/community-engine-vue
          ref: vue3-migration
          path: community-engine-vue

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: better-together-vue/yarn.lock

      - name: Install CEV dependencies
        working-directory: community-engine-vue
        run: yarn install --frozen-lockfile

      - name: Install BTV dependencies
        working-directory: better-together-vue
        run: yarn install --frozen-lockfile

      - name: Lint
        working-directory: better-together-vue
        run: yarn lint --no-fix

  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout better-together-vue
        uses: actions/checkout@v4
        with:
          path: better-together-vue

      - name: Checkout community-engine-vue
        uses: actions/checkout@v4
        with:
          repository: better-together-org/community-engine-vue
          ref: vue3-migration
          path: community-engine-vue

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: better-together-vue/yarn.lock

      - name: Install CEV dependencies
        working-directory: community-engine-vue
        run: yarn install --frozen-lockfile

      - name: Install BTV dependencies
        working-directory: better-together-vue
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        working-directory: better-together-vue
        run: yarn test:run

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout better-together-vue
        uses: actions/checkout@v4
        with:
          path: better-together-vue

      - name: Checkout community-engine-vue
        uses: actions/checkout@v4
        with:
          repository: better-together-org/community-engine-vue
          ref: vue3-migration
          path: community-engine-vue

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: better-together-vue/yarn.lock

      - name: Install CEV dependencies
        working-directory: community-engine-vue
        run: yarn install --frozen-lockfile

      - name: Install BTV dependencies
        working-directory: better-together-vue
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: better-together-vue
        run: yarn build
